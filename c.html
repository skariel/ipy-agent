                                    IPython worker\n```\n\n`pyproject.toml` installs the coordinator dependencies without SRT, bubblewrap,\nsocat, or other sandbox-runtime prerequisites. The normal CLI has no workspace\nconfinement or network-policy option. It explicitly selects a provider and starts\na persistent local IPython child process. Direct user cells and agent-generated\ncells share that worker namespace. The process boundary supplies transport and\nlifecycle separation only: code runs as the current user, with ordinary access to\navailable files, subprocesses, network, and credentials. There is no default\npermission broker or credential isolation. To isolate execution, users must run\n`py` inside isolation they provide, or explicitly select the optional wrapper-backed `isolated` executor with\n`--plugin isolated-executor --executor isolated` and a trusted wrapper config.\n`py` does not verify the wrapper's actual isolation policy.\n\nThe default TTY path serializes execution: queued `@`/`!`/`%` cells run after a\ncompleted agent cell and before its next provider request, never concurrently.\nSlash commands remain queued until the active turn finishes. An English request iterates\nprovider responses and generated cells until a successful `say(..., final=True)`\nor interruption; a positive `agent.max_steps` opts into a step limit (default 0,\nunlimited). Execution results become observations for later steps;\nside-effecting cells are never automatically replayed.\nDirect `@` Python, `!` shell escapes, and `%` IPython magics execute in the same\nnamespace. The default terminal also has built-in `/help`, `/status`, `/interrupt`,\n`/quit`, `/config`, `/plugins`, and `/history` commands. Batch/JSON mode is not implemented.\n\n`LocalExecutor` replaces stdout/stderr exceeding 8000 characters with a notice\nand retains up to 1 Mi characters in the persistent `outputs[index]` namespace\nfor small follow-up slices. At 20 small execution results, older results are\n s next provider request, never concurrently.\nSlash commands remain queued until the active turn finishes. An English request iterates\nprovider responses and generated cells until a successful `say(..., final=True)`\nor interruption; a positive `agent.max_steps` opts into a step limit (default 0,\nunlimited). Execution results become observations for later steps;\nside-effecting cells are never automatically replayed.\nDirect `@` Python, `!` shell escapes, and `%` IPython magics execute in the same\nnamespace. The default terminal also has built-in `/help`, `/status`, `/interrupt`,\n`/quit`, `/config`, `/plugins`, and `/history` commands. Batch/JSON mode is not implemented.\n\n`LocalExecutor` replaces stdout/stderr exceeding 8000 characters with a notice\nand retains up to 1 Mi characters in the persistent `outputs[index]` namespace\nfor small follow-up slices. At 20 small execution results, older results are\nstored in that namespace and replaced with short references in model context;\nlarge-output references are exempt. Other model-facing observations and model\nresponses also have 8000-character bounds; user input is not clipped. The executor has\nworker startup/interrupt timeouts, but no normal cell execution deadline. Correlated\n`input()`/`getpass()` requests require a capable owning frontend. A worker failure or interrupt can discard in-memory Python state;\npartial side effects are not rolled back or replayed. An explicit `--journal PATH`\nselects an append-only SQLite journal and bounded `/history`; otherwise a\nno-persistence implementation is selected. `/usage` and `/trace` are not implemented.\n\n## Providers: deterministic fake versus production\n\nProvider selection is explicit through `--provider` or `provider.id` in the\nselected JSON config. There is no implicit production provider/model.\n\n- **`fake`** is deterministic, requires no credentials, and makes no outbound\n\n26\nplugin_command\nplugin_executor\nplugin_observer\n M src/py_agent/provide isolation is required, launch\n`py` inside an isolation environment that you provide and trust.\n\nInstall with Python 3.12–3.14 and `uv`:\n\n```sh\nuv sync --locked\nuv run --locked py --provider fake\n```\n\nFor an installed, non-editable tool copy, use the repository scripts:\n\n```sh\n./install.sh\n./run.sh                              # litelm + deepseek/deepseek-flash\nPROVIDER=fake ./run.sh                # deterministic local wiring; no model calls\nPROVIDER=codex MODEL=openai-codex/YOUR_MODEL ./run.sh\n./run.sh --config /path/to/trusted-settings.json  # uses that file's provider\n```\n\n`run.sh` forwards extra `py` arguments and starts in your current directory,\nor in `WORKSPACE` when set. With no provider, model, or config selection it defaults\nto `litelm` with `deepseek/deepseek-flash`; requests occur only after submitting\nEnglish input. Use `PROVIDER=fake` for the no-network fixture. Installing/running\nthis way requires no sandbox tools. The installed copy must\nbe reinstalled after source changes.\n\nThe fake provider is deterministic, makes no model request, and is **not a language\nmodel**; use it for a local wiring/demo path only. Production providers are explicit\nand require a model:\n\n```sh\nuv run --locked py --provider litelm --model openai/YOUR_MODEL\nuv run --locked py --provider codex --model openai-codex/YOUR_MODEL\n```\n\nThe litelm adapter reads matching static API-key entries from Pi's private\n`~/.pi/agent/auth.json` on each request (or from `--pi-auth PATH`) and passes only\nthe selected model provider's key to litelm. If no matching entry exists, litelm's\nnormal provider \n"}],"refs":["372bded3eadd4ed0a97b7456573845ac"],"execution_output_indexes":[1]},{"messages":[{"role":"assistant","content":"print(sh(\"wc -l src/py_agent/*.py | sort -n\"))\nprint(outputs[1][2500:5500])"},{"role":"observation","content":"stdout:\n     0 src/py_agent/__init__.py\n    20 src/py_agent/limits.py\n    33 src/py_agent/observations.py\n    36 src/py_a zes execution: queued `@`/`!`/`%` cells run after a\ncompleted agent cell and before its next provider request, never concurrently.\nSlash commands remain queued until the active turn finishes. An English request iterates\nprovider responses and generated cells until a successful `say(..., final=True)`\nor interruption; a positive `agent.max_steps` opts into a step limit (default 0,\nunlimited). Execution results become observations for later steps;\nside-effecting cells are never automatically replayed.\nDirect `@` Python, `!` shell escapes, and `%` IPython magics execute in the same\nnamespace. The default terminal also has built-in `/help`, `/status`, `/interrupt`,\n`/quit`, `/config`, `/plugins`, and `/history` commands. Batch/JSON mode is not implemented.\n\n`LocalExecutor` replaces stdout/stderr exceeding 8000 characters with a notice\nand retains up to 1 Mi characters in the persistent `outputs[index]` namespace\nfor small follow-up slices. At 20 small execution results, older results are\nstored in that namespace and replaced with short references in model context;\nlarge-output references are exempt. Other model-facing observations and model\nresponses also have 8000-character bounds; user input is not clipped. The executor has\nworker startup/interrupt timeouts, but no normal cell execution deadline. Correlated\n`input()`/`getpass()` requests require a capable owning frontend. A worker failure or interrupt can discard in-memory Python state;\npartial side effects are not rolled back or replayed. An explicit `--journal PATH`\nselects an append-only SQLite journal and bounded `/history`; otherwise a\nno-persistence implementation is selected. `/usage` and `/trace` are not implemented.\n\n## Providers: deterministic fake versus production\n\nProvider selection is explicit through `--provider` or `provider.id` in the\nselected JSON config. There is no implicit production provider/model.\n\n- **`fake`** is deterministic, requires no credentials, and makes no ou <script>

const current=data.current_context||{messages:[]};document.getElementById('summary').append(stat('messages',current.messages?.length||0),stat('epoch',current.epoch??'?'),stat('last model request',data.last_model_request?'yes':'none'),stat('collapsed archives',data.collapsed_archives?.length||0));
function copyButton(text){const b=document.createElement('button');b.className='copy';b.textContent='Copy';b.onclick=async e=>{e.preventDefault();try{if(navigator.clipboard)await navigator.clipboard.writeText(text);else throw Error()}catch{const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove()}b.textContent='Copied';setTimeout(()=>b.textContent='Copy',900)};return b}
function messageCard(m,i){const d=document.createElement('details');d.className='message';d.open=i===0||i>=(current.messages?.length||0)-2;d.dataset.search=(esc(m.role)+' '+esc(m.phase)+' '+esc(m.content)).toLowerCase();const s=document.createElement('summary');const r=document.createElement('span');r.className='role '+m.role;r.textContent=m.role;const n=document.createTextNode(' #'+(i+1));s.append(r,n);if(m.phase){const p=document.createElement('span');p.className='phase';p.textContent=m.phase;s.append(p)}const pre=document.createElement('pre');pre.textContent=esc(m.content);d.append(s,copyButton(esc(m.content)),pre);return d}
function section(title,open=true){const d=document.createElement('details');d.className='section';d.open=open;const s=document.createElement('summary');s.textContent=title;const b=document.createElement('div');b.className='section-body';d.append(s,b);root.append(d);return b}
const mb=section('Current live context',true);const ml=document.createElement('div');ml.className='messages';(current.messages||[]).forEach((m,i)=>ml.append(messageCard(m,i)));if(!ml.children.length)ml.innerHTML='<div class="empty">No messages.</div>';mb.append(ml);
const exact=data.last_model_request?.context?.messages||[];if(exact.length){const eb=section('Last exact dispatched context',false);const el=document.createElement('div');el.className='messages';exact.forEach((m,i)=>el.append(messageCard(m,i)));eb.append(el)}
function jsonSection(title,value,open=false){const b=section(title,open);const text=JSON.stringify(value,null,2);b.append(copyButton(text));const p=document.createElement('pre');p.className='json';p.textContent=text;b.append(p)}
