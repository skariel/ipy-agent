rity boundary.\n\nRegistration hooks are synchronous, non-wrapper Pluggy implementations. They return immutable declarative `Contributions`; they must not create resources or execute user code. Duplicate IDs, unknown hooks, unsupported API versions, missing/ambiguous dependencies, dependency cycles, invalid configuration ownership, and contribution collisions fail registry construction. Manifest dependency ordering is deterministic and lexical among simultaneously ready plugins.\n\nPublic registration records are in `py_agent.plugins`; immutable data and protocols are in `py_agent.contracts`; scalar schema types are in `py_agent.configuration`. Examples import only those public modules. Namespaced configuration fields belong to the registering plugin. Factories for commands, transformations, and observers receive an immutable mapping of that plugin's configuration keys with the plugin-ID prefix removed. Defaults are used when a host's `ConfigStore` does not contain those fields. The host snapshots configuration per submission; transformation/command factories are invoked with that request's snapshot.\n\n## Services and commands\n\nA generic `Service(kind, id, factory)` is selected only by explicit `(kind, id)`; service selection never depends on import order. The coordinator selects `router`, `provider`, `interpreter`, and `executor`, and validates the\n","phase":null},{"role":"assistant","content":"import ast\nfrom pathlib import Path\nsrc = Path(\"/home/skariel/work/py/src/py_agent\")\nfor name in [\"builtin_services.py\",\"production_services.py\",\"observations.py\",\"limits.py\",\"collapse_control.py\"]:\n    tree = ast.parse((src/name).read_text())\n    print(\"=\"*60); print(name)\n    for node in tree.body:\n        if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):\n            print(f\"  def {node.name}\")\n        elif isinstance(node, ast.ClassDef):\n            print(f\"  class {node.name}\")\n            for c in node.body:\n "phase":null},{"role":"assistant","content":"say(\"\"\"## Codebase summary: `/home/skariel/work/py`\n\n`py` is a **local coding-agent prototype**: a coordinator that routes English requests to a selected provider, interprets the returned Python, and executes it in a **persistent IPython worker** whose namespace is shared between user-typed cells and agent-generated cells. Default execution is unrestricted (no sandbox) — a separate process for transport/lifecycle only.\n\n### Layout\n- `src/py_agent/` (~15.3k lines), `tests/` (23 files, **349 tests**), `examples/`, `pyproject.toml`, `run.sh`/`install.sh`, docs (`README`, `ARCHITECTURE_PLAN/STATUS`, `PLUGIN_API`).\n- Git: branch `refactor/jupyter-kernel` @ `08f0744`, clean tree; `master` @ `45e0306`.\n\n### Core flow\n`cli.py` parses ~24 flags (`--provider`, `--model`, `--executor`, `--context-transform`, `--journal`, `--effort`, `--max-agent-steps`, …) and selects services. `Coordinator` (state machine: `submit`/`enqueue`/queue-worker/`_execute_dispatched`) assembles a `ContextSnapshot`, applies context+model transforms, calls a `ProviderService`, interprets the response via a `BasicInterpreter`, and executes it through an `Executor` — publishing `OutputEvent`s and handling `say(final=…)`.\n\n### Key modules\n- **contracts.py** — frozen dataclasses (`Origin`, `ExecutionRequest/Result`, `Submission`, `SayOutput`, `ContextSnapshot`, `ModelResponse`, `Completion/Inspection/CompletenessResult`) + Protocols (`Provider/Context/Observation/Transform/Router/Executor`). These are the public interfaces.\n- **plugins.py** — Pluggy-based `PluginRuntime`; entry-point group `ipy_agent.plugins`; declarative `Contributions` (services, config fields, commands, transforms, observers, executor wrappers); manifest versioning/dependency ordering. Discovery imports nothing until explicitly enabled.\n- **configuration.py** — `ConfigRegistry`/`ConfigStore`/`ConfigSnapshot` with layered sources, typed `ConfigField`s, per-plugin namespaced fields, sensitivity/persistence flags.\n- **context.py** — `Context`/`Group` with token estimation, collapse/archive, output spooling, boundary IDs.\n- **provider.py / codex*.py** — `LitelmProvider` (reads Pi `~/.pi/agent/auth.json`), `CodexProvider` (subscription creds/OAuth), deterministic `FakeProvider`; retry policy (2 retries on transient failures).\n- **builtin_services.py / production_services.py** — `DefaultRouter`, `FakeProvider`, `BasicInterpreter`, `BuiltinPlugin`; production adapters (`ProductionContextAdapter`, `ProductionProviderAdapter`, `ProductionObservationAdapter`, litelm/codex factories).\n- **Executors** — `local_executor.py` (frame protocol, redaction) + `local_worker.py` (in-worker dispatch, `!`/`%` handling, output capture, getpass/input) is the default; `isolated_executor.py` runs a validated wrapper command; `jupyter_kernel.py` + `kernel_sessions.py` add a Jupyter-kernel-backed executor with private session records, process pinning, and Linux identity checks.\n- **Frontends** — `plain_terminal.py` (TTY status bar, history, markdown via `terminal_markdown.py`); `config_commands.py` implements slash commands (`/help`, `/status`, `/model`, `/effort`, `/context`, `/history`, …); `context_export.py` writes the unredacted HTML explorer; `session_journal.py` persists history to SQLite (redacted) or no-op.\n\n### Notable entry points\nConsole script `py` → `cli.py`; Jupyter path → `jupyter_kernel.main`; management subcommands for session listing/shutdown.\n\nWant me to dive deeper into any specific area (e.g., the kernel-session refactor, plugin authoring, or the test suite)?\"\"\", final=True)","phase":null}],"transform_trace":[]},"last_model_request":{"origin":{"session_id":"311dadbfce8d46ed93c5acc46caff3a8","request_id":"810d3723f567400db6456b0bfe1c0951","frontend_id":"terminal","config_revision":1,"generation_id":"79d360b6ffa54afba86def96c14cd769","execution_id":null},"model":"deepseek/deepseek-flash","options":{"effort":"low"},"transform_trace": edential isolation. Starting in a project directory does not\nrestrict access to other readable/writable paths. If isolation is required, launch\n`py` inside an isolation environment that you provide and trust.\n\nInstall with Python 3.12–3.14 and `uv`:\n\n```sh\nuv sync --locked\nuv run --locked py --provider fake\n```\n\nFor an installed, non-editable tool copy, use the repository scripts:\n\n```sh\n./install.sh\n./run.sh                              # litelm + deepseek/deepseek-flash\nPROVIDER=fake ./run.sh                # deterministic local wiring; no model calls\nPROVIDER=codex MODEL=openai-codex/YOUR_MODEL ./run.sh\n./run.sh --config /path/to/trusted-settings.json  # uses that file's provider\n```\n\n`run.sh` forwards extra `py` arguments and starts in your current directory,\nor in `WORKSPACE` when set. With no provider, model, or config selection it defaults\nto `litelm` with `deepseek/deepseek-flash`; requests occur only after submitting\nEnglish input. Use `PROVIDER=fake` for the no-network fixture. Installing/running\nthis way requires no sandbox tools. The installed copy must\nbe reinstalled after source changes.\n\nThe fake provider is deterministic, makes no model request, and is **not a language\nmodel**; use it for a local wiring/demo path only. Production providers are explicit\nand require a model:\n\n```sh\nuv run --locked py --provider litelm --model openai/YOUR_MODEL\nuv run --locked py --provider codex --model openai-codex/YOUR_MODEL\n```\n\nThe litelm adapter reads matching static API-key entries from Pi's private\n`~/.pi/agent/auth.json` on each request (or from `--pi-auth PATH`) and passes only\nthe selected model provider's key to litelm. If no matching entry exists, litelm's\nnormal provider \n","phase":null},{"role":"assistant","content":"import ast\nfrom pathlib import Path\nsrc = Path(\"/home/skariel/work/py/src/py_agent\")\n# Extract CLI arguments from default_parser\ntree = ast.parse((src/\"cli.py\").read_text())\nfor node in tree.body:\n    if isinstance(node, ast.FunctionDef) and node.name in (\"default_parser\",\"_management_parser\"):\n        opts = []\n        for n in ast.walk(node):\n            if isinstance(n, ast.Call) and isinstance(n.func, ast.Attribute) and n.func.attr == \"add_argument\":\n                for a in n.args:\n                    if isinstance(a, ast.Constant) and isinstance(a.value, str):\n                        opts.append(a.value)\n        print(f\"\\n{node.name} args:\")\n        for o in opts:\n            print(\"   \", o)","phase":null},{"role":"observation","content":"stdout:\n\ndefault_parser args:\n    --version\n    --provider\n    --plugin\n    --router\n    --interpreter\n    --executor\n    --executor-wrapper\n    --context-transform\n    --model-transform\n    --observer\n    --model\n    --api-base\n    --stream\n    --effort\n    --pi-auth\n    --config\n    --max-tokens\n    --max-agent-steps\n    --context-window-tokens\n    --startup-timeout\n    --max-output-chars\n    --journal\n    --vi\n    --multiline\n    --no-color\n\n_management_parser args:\n    --name\n    --display-name\n    --session-root\n    --wait-timeout\n    id\n    --session-root\n    --shutdown-timeout\n    --session-root\n    id\n    --session-root\n","phase":null},{"role":"assistant","content":"from pathlib import Path\nroot = Path(\"/home/skariel/work/py\")\nfor d in [\".py\",\".pi\"]:\n    p = root/d\n    print(f\"{d}: exists={p.exists()}\")\n# README tail\ntxt = (root/\"README.md\").read_text()\nprint(\"\\nREADME length:\", len(txt))\nprint(txt[2500:5000])","phase":null},{"role":"observation","content":"stdout:\n.py: exists=True\n.pi: exists=True\n\nREADME length: 16983\nenvironment remains available. Command-backed `!…` keys and OAuth\nentries are not executed by this adapter. Codex uses Pi subscription credentials\n(login/refresh remain Pi's responsibility). A provider request is made only after submitting an\nEnglish request. The `py` CLI itself still requires an explicit provider/model;\nonly `run.sh` supplies the DeepSeek Flash launcher default.\nRecognized transient provider failures (rate limits, transport/timeouts, and\nserver 5xx errors) receive up to two retries before any Python cell executes;\na lost response can still mean both model attempts were billed. Authentication,\nrequest, format, and unknown local errors are not retried.\n\nThe default frontend requires a TTY; batch/JSON mode is not implemented. While\nan agent request runs, the status bar shows activity, with completed-cell\noutput and `say()` messages below. Provider text is not streamed live. The\nterminal displays each stdout/stderr stream once, after its cell finishes;\nit suppresses provisional executor previews to avoid duplicate output panels.\nOversized output is stored as `outputs[index]`. Silent code can appear idle.\nIt accepts\nEnglish requests, `@` Python,\n`!` shell escapes, `%` IPython magics, and the\nbuilt-in slash commands `/help`, `/status`, `/interrupt`, `/quit`, `/config`,\n`/plugins`, `/model`, `/effort`, `/context`, and `/history` (when a journal is selected).\n`/model [MODEL_ID]` and `/effort [PRESET]` apply immediate, session-local overrides;\nthey do not change the selected provider or persist configuration. Effort presets are\n`none`, `minimal`, `low`, `medium`, `high`, and `xhigh`; DeepSeek maps `minimal`/`low`\nto `low`, `medium`/`high` to `high`, `xhigh` to `max`, and disables thinking for `none`.\n`/context save [PATH]`\nwrites a private (mode `0600`), standalone HTML explorer containing the current\nlive messages, system prompt, last exact dispatched request, runtime/tool\nmetadata, raw context groups, and collapsed archives; it is intentionally unredacted\nand must be treated as sensitive. `say(text, final=False)` publishes progress; a successful cell\ncalling `say(text, final=True)` completes the request. Without it, the agent\ncontinues until interrupted or finished by default; `--max-agent-steps N` (or\n`agent.max_steps`) opts into a per-request cap. Zero means unlimited for\nsuccessfully generated cells; three consecutive invalid model responses still\npause to avoid unbounded format-retry requests. `wait()`, a host history API,\nand resume are not\n","phase":null},{"role":"assistant","content":"from pathlib import Path\nroot = Path(\"/home/skariel/work/py\")\ntxt = (root/\"PLUGIN_API.md\").read_text()\nprint(\"PLUGIN_API.md len\", len(txt))\nprint(txt[:2500])","phase":null},{"role":"observation","content":"stdout:\nPLUGIN_API.md len 9493\n# External plugin API (v1 draft)\n\nThis document describes the public plugin API currently implemented. API v1 is still a draft; the examples are an external-boundary exercise, not a compatibility freeze.\n\n## Activation and registration\n\nA separately installed distribution declares an entry point in `ipy_agent.plugins`, whose name matches its manifest ID:\n\n```toml\n[project.entry-points.\"ipy_agent.plugins\"]\nmy-plugin = \"my_plugin:plugin\"\n```\n\n```python\nfrom py_agent.plugins import Contributions, PluginManifest, Service, hookimpl\n\nclass MyPlugin:\n    @hookimpl\n    def py_agent_register(self) -> Contributions:\n        return Contributions(\n            PluginManifest(\"my-plugin\"),\n            services=(Service(\"executor\", \"alternate\", AlternateExecutor),),\n        )\n\nplugin = MyPlugin()\n```\n\nDiscovery lists entry-point metadata without importing plugin code. Only names passed to `PluginRuntime.load(enabled=(... ,))` are imported. Built-ins are also supplied explicitly. Installation, workspace files, notebook metadata, and model output never activate plugins. Plugin loading is trusted arbitrary Python execution, not a security boundary.\n\nRegistration hooks are synchronous, non-wrapper Pluggy implementations. They return immutable declarative `Contributions`; they must not create resources or execute user code. Duplicate IDs, unknown hooks, unsupported API versions, missing/ambiguous dependencies, dependency cycles, i /work/py`\n\n`py` is a **local coding-agent prototype**: a coordinator that routes English requests to a selected provider, interprets the returned Python, and executes it in a **persistent IPython worker** whose namespace is shared between user-typed cells and agent-generated cells. Default execution is unrestricted (no sandbox) — a separate process for transport/lifecycle only.\n\n### Layout\n- `src/py_agent/` (~15.3k lines), `tests/` (23 files, **349 tests**), `examples/`, `pyproject.toml`, `run.sh`/`install.sh`, docs (`README`, `ARCHITECTURE_PLAN/STATUS`, `PLUGIN_API`).\n- Git: branch `refactor/jupyter-kernel` @ `08f0744`, clean tree; `master` @ `45e0306`.\n\n### Core flow\n`cli.py` parses ~24 flags (`--provider`, `--model`, `--executor`, `--context-transform`, `--journal`, `--effort`, `--max-agent-steps`, …) and selects services. `Coordinator` (state machine: `submit`/`enqueue`/queue-worker/`_execute_dispatched`) assembles a `ContextSnapshot`, applies context+model transforms, calls a `ProviderService`, interprets the response via a `BasicInterpreter`, and executes it through an `Executor` — publishing `OutputEvent`s and handling `say(final=…)`.\n\n### Key modules\n- **contracts.py** — frozen dataclasses (`Origin`, `ExecutionRequest/Result`, `Submission`, `SayOutput`, `ContextSnapshot`, `ModelResponse`, `Completion/Inspection/CompletenessResult`) + Protocols (`Provider/Context/Observation/Transform/Router/Executor`). These are the public interfaces.\n- **plugins.py** — Pluggy-based `PluginRuntime`; entry-point group `ipy_agent.plugins`; declarative `Contributions` (services, config fields, commands, transforms, observers, executor wrappers); manifest versioning/dependency ordering. Discovery imports nothing until explicitly enabled.\n- **configuration.py** — `ConfigRegistry`/`ConfigStore`/`ConfigSnapshot` with layered sources, typed `ConfigField`s, per-plugin namespaced fields, sensitivity/persistence flags.\n- **context.py** — `Context`/`Group` with token estimation, collapse/archive, output spooling, boundary IDs.\n- **provider.py / codex*.py** — `LitelmProvider` (reads Pi `~/.pi/agent/auth.json`), `CodexProvider` (subscription creds/OAuth), deterministic `FakeProvider`; retry policy (2 retries on transient failures).\n- **builtin_services.py / production_services.py** — `DefaultRouter`, `FakeProvider`, `BasicInterpreter`, `BuiltinPlugin`; production adapters (`ProductionContextAdapter`, `ProductionProviderAdapter`, `ProductionObservationAdapter`, litelm/codex factories).\n- **Executors** — `local_executor.py` (frame protocol, redaction) + `local_worker.py` (in-worker dispatch, `!`/`%` handling, output capture, getpass/input) is the default; `isolated_executor.py` runs a validated wrapper command; `jupyter_kernel.py` + `kernel_sessions.py` add a Jupyter-kernel-backed executor with private session records, process pinning, and Linux identity checks.\n- **Frontends** — `plain_terminal.py` (TTY status bar, history, markdown via `terminal_markdown.py`); `config_commands.py` implements slash commands (`/help`, `/status`, `/model`, `/effort`, `/context`, `/history`, …); `context_export.py` writes the unredacted HTML explorer; `session_journal.py` persists history to SQLite (redacted) or no-op.\n\n### Notable entry points\nConsole script `py` → `cli.py`; Jupyter path → `jupyter_kernel.main`; management subcommands for session listing/shutdown.\n\nWant me to dive deeper into any specific area (e.g., the kernel-session refactor, plugin authoring, or the test suite)?\"\"\", final=True)"}],"refs":["810d3723f567400db6456b0bfe1c0951"],"execution_output_indexes":[]}],"reported_input_tokens":11457,"window_tokens":272000},"collapsed_archives":[{"index":1,"content":{"version":1,"start_id":"u1","end_id":"m1","groups":[{"messages":[{"role":"user","content":"explore this codebase","boundary_id":"u1","boundary_kind":"user"}],"refs":["4e799bc4b78946a29eabd1a43b27e787"],"execution_output_indexes":[]},{"messages":[{"role":"assistant","content" E.md =====\n# py\n\n`py` is a local coding-agent prototype with a small coordinator and a persistent\nIPython worker. The default CLI routes English requests to one explicitly selected\nprovider, interprets responses as Python, executes bounded agent cells,\nand displays the result. User-authored direct cells and generated cells share the\nsame live namespace.\n\n## Current default CLI\n\nThe default executor is **unrestricted local execution**. Python, IPython shell\nescapes, subprocesses, and agent-generated code run with the current user's normal\nfilesystem, process, network, and credential access. The worker is a separate\nprocess for transport and lifecycle management only; it is not a sandbox or a\nsecurity boundary. The default has no permission broker, filesystem confinement,\nnetwork proxy, or credential isolation. Starting in a project directory does not\nrestrict access to other readable/writable paths. If isolation is required, launch\n`py` inside an isolation environment that you provide and trust.\n\nInstall with Python 3.12–3.14 and `uv`:\n\n```sh\nuv sync --locked\nuv run --locked py --provider fake\n```\n\nFor an installed, non-editable tool copy, use the repository scripts:\n\n```sh\n./install.sh\n./run.sh                              # litelm + deepseek/deepseek-flash\nPROVIDER=fake ./run.sh                # deterministic local wiring; no model calls\nPROVIDER=codex MODEL=openai-codex/YOUR_MODEL ./run.sh\n./run.sh --config /path/to/trusted-settings.json  # uses that file's provider\n```\n\n`run.sh` forwards extra `py` arguments and starts in your current directory,\nor in `WORKSPACE` when set. With no provider, model, or config selection it defaults\nto `litelm` with `deepseek/deepseek-flash`; requests occur only after submitting\nEnglish input. Use `PROVIDER=fake` for the no-network fixture. Installing/running\nthis way requires no sandbox tools. The installed copy must\nbe reinstalled after source changes.\n\nThe fake provider is deterministic, makes no model request, and is **not a language\nmodel**; use it for a local wiring/demo path only. Production providers are explicit\nand require a model:\n\n```sh\nuv run --locked py --provider litelm --model openai/YOUR_MODEL\nuv run --locked py --provider codex --model openai-codex/YOUR_MODEL\n```\n\nThe litelm adapter reads matching static API-key entries from Pi's private\n`~/.pi/agent/auth.json` on each request (or from `--pi-auth PATH`) and passes only\nthe selected model provider's key to litelm. If no matching entry exists, litelm's\nnormal provider environment remains available. Command-backed `!…` keys and OAuth\nentries are not executed by this adapter. Codex uses Pi subscription credentials\n(login/refresh remain Pi's responsibility). A provider request is made only after submitting an\nEnglish request. The `py` CLI itself still requires an explicit provider/model;\nonly `run.sh` supplies the DeepSeek Flash launcher default.\nRecognized transient provider failures (rate limits, transport/timeouts, and\nserver 5xx errors)\n"}],"refs":["4e799bc4b78946a29eabd1a43b27e787"],"execution_output_indexes":[1]},{"messages":[{"role":"assistant","content":"out = outputs[1]\n# print the rest of the overview\nprint(out[3000:9000])"},{"role":"observation","content":"stdout:\n receive up to two ret\n\n===== ARCHITECTURE_PLAN.md =====\n# Architecture plan: plugin-driven coding agent\n\n## 1. Product and scope\n\n`py` is an English-first coding agent with a persistent Python workspace. Ordinary input asks the agent to do something. Direct Python, shell commands and application commands remain available. User and agent code share an IPython namespace.\n\nThe application is a small dataflow coordinator surrounded by plugins. Its initial frontend is the existing terminal. A Jupyter kernel is added after the plugin architecture works independently of any frontend.\n\nExecution is local and unrestricted by default, with the current user's permissions. There is no mandatory sandbox, permission broker, container runtime or network proxy. Users may launch `py` through their preferred VM/container/sandbox wrapper. Plugins may supply alternative execution environments or isolation for individual operations.\n\nDo not describe unrestricted execution as permission-enforced or credential-isolated. Python can access files, subprocesses and network directly. A separate same-user process alone is not a security boundary. Per-operation isolation does not isolate arbitrary code executed elsewhere.\n\n## 2. Architecture\n\n```text\nfrontend plugin\n    | typed user actions\n    v\nsmall core coordinator\n    input routing -> context -> provider -> response interpretation\n                            ^                    |\n                            |                    v\n                       observations \u003c- persistent executor\n                            |\n                     output/event delivery\n                            |\n                  frontend + journal + observers\n```\n\nBuilt-in plugins implement ordinary application behavior. Third-party plugins use the same public contracts; they must not need private imports or monkeypatching.\n\n### Stable core responsibilities\n\n- Typed records and versioned service contracts.\n- Plugin discovery, activation, validation and service selection.\n- Configuration resolution and atomic configuration revisions.\n- Session/request/execution identities and correlation.\n- Dataflow orchestration and explicit state transitions.\n- Cancellation, execution serialization and stale-result rejection.\n- Hook dispatch, bounded event delivery and failure propagation.\n- Lifecycle ownership and deterministic resource cleanup.\n\nThe core does not implement provider wire formats, context eviction policy, IPython execution, terminal formatting or filesystem permission policy.\n\n### Plugin responsibilities\n\n| Area | Initial implementation |\n| --- | --- |\n| Input routing | English, `@` Python, `!` shell, `%`/`%%` magics, slash commands |\n| Commands | help, usage, history, reset, config, plugins, interrupt |\n| Providers | Codex, API-key adapter, deterministic fake provider |\n| Response interpretation | Extract executable Python, validate completion, preserve reasoning separately |\n| Context | Append-only epochs, explicit reset, live namespace inventory, memories conventions |\n| Execution | Local pers\n\n===== ARCHITECTURE_STATUS.md =====\n# Architecture implementation status\n\nThis document records the implementation visible in the current CLI, coordinator,\nplugin/configuration modules, optional Jupyter adapter, and `pyproject.toml`, in\ncontrast with the target in [ARCHITECTURE_PLAN.md](ARCHITECTURE_PLAN.md). It is a\ncode/documentation review, not a verification report: no tests or live provider\ncalls were run for this update.\n\n## Current default architecture\n\nThe default `py` command is a coordinator-based vertical slice:\n\n```text\nPlainTerminal -> Coordinator -> selected router/provider/interpreter/executor\n                                   |                         |\n                             context + config          LocalExecutor\n                                                         IPython worker\n```\n\n`pyproject.toml` installs the coordinator dependencies without SRT, bubblewrap,\nsocat, or other sandbox-runtime prerequisites. The normal CLI has no workspace\nconfinement or network-policy option. It explicitly selects a provider and starts\na persistent local IPython child process. Direct user cells and agent-generated\ncells share that worker namespace. The process boundary supplies transport and\nlifecycle separation only: code runs as the current user, with ordinary access to\navailable files, subprocesses, network, and credentials. There is no default\npermission broker or credential isolation. To isolate execution, users must run\n`py` inside isolation they provide, or explicitly select the optional wrapper-backed `isolated` executor with\n`--plugin isolated-executor --executor isolated` and a trusted wrapper config.\n`py` does not verify the wrapper's actual isolation policy.\n\nThe default TTY path serializes execution: queued `@`/`!`/`%` cells run after a\ncompleted agent cell and before its next provider request, never concurrently.\nSlash commands remain queued until the active turn finishes. An English request iterates\nprovider responses and generated cells until a successful `say(..., final=True)`\nor interruption; a positive `agent.max_steps` opts into a step limit (default 0,\nunlimited). Execution results become observations for later steps;\nside-effecting cells are never automatically replayed.\nDirect `@` Python, `!` shell escapes, and `%` IPython magics execute in the same\nnamespace. The default terminal also has built-in `/help`, `/status`, `/interrupt`,\n`/quit`, `/config`, `/plugins`, and `/history` commands. Batch/JSON mode is not implemented.\n\n`LocalExecutor` replaces stdout/stderr exceeding 8000 characters with a notice\nand retains up to 1 Mi characters in the persistent `outputs[index]` namespace\nfor small follow-up slices. At 20 small execution results, older results are\nstored in that namespace and replaced with short references in model context;\nlarge-output references are exempt. Other model-facing observations and model\nresponses also have 8000-character bounds; use\n"}],"refs":["4e799bc4b78946a29eabd1a43b27e787"],"execution_output_indexes":[1]},{"messages":[{"role":"assistant","content":"print(out[9000:15000])"},{"role":"observation","content":"stdout:\nr input is not clipped. The executor has\nworker startup/interrupt timeouts, but no normal cell\n\n===== PLUGIN_API.md =====\n# External plugin API (v1 draft)\n\nThis document describes the public plugin API currently implemented. API v1 is still a draft; the examples are an external-boundary exercise, not a compatibility freeze.\n\n## Activation and registration\n\nA separately installed distribution declares an entry point in `ipy_agent.plugins`, whose name matches its manifest ID:\n\n```toml\n[project.entry-points.\"ipy_agent.plugins\"]\nmy-plugin = \"my_plugin:plugin\"\n```\n\n```python\nfrom py_agent.plugins import Contributions, PluginManifest, Service, hookimpl\n\nclass MyPlugin:\n    @hookimpl\n    def py_agent_register(self) -> Contributions:\n        return Contributions(\n            PluginManifest(\"my-plugin\"),\n            services=(Service(\"executor\", \"alternate\", AlternateExecutor),),\n        )\n\nplugin = MyPlugin()\n```\n\nDiscovery lists entry-point metadata without importing plugin code. Only names passed to `PluginRuntime.load(enabled=(... ,))` are imported. Built-ins are also supplied explicitly. Installation, workspace files, notebook metadata, and model output never activate plugins. Plugin loading is trusted arbitrary Python execution, not a security boundary.\n\nRegistration hooks are synchronous, non-wrapper Pluggy implementations. They return immutable declarative `Contributions`; they must not create resources or execute user code. Duplicate IDs, unknown hooks, unsupported API versions, missing/ambiguous dependencies, dependency cycles, invalid configuration ownership, and contribution collisions fail registry construction. Manifest dependency ordering is deterministic and lexical among simultaneously ready plugins.\n\nPublic registration records are in `py_agent.plugins`; immutable data and protocols are in `py_agent.contracts`; scalar schema types are in `py_agent.configuration`. Examples import only those public modules. Namespaced configuration fields belong to the registering plugin. Factories for commands, transformations, and observers receive an immutable mapping of that plugin's configuration keys with the plugin-ID prefix removed. Defaults are used when a host's `ConfigStore` does not contain those fields. The host snapshots configuration per submission; transformation/command factories are invoked with that request's snapshot.\n\n## Services and commands\n\nA generic `Service(kind, id, factory)` is selected only by explicit `(kind, id)`; service selection never depends on import order. The coordinator selects `router`, `provider`, `interpreter`, and `executor`, and validates their public methods. The selected executor must declare `ExecutorCapabilities`; no local-executor fallback occurs.\n\nUse `CommandContribution(name, factory, summary, usage)` for a slash command. Its factory receives the plugin's config mapping and returns an object with `execute(arguments: str)`. The result can be text or an awaitable producing text. External commands are exposed as `PluginRuntime.commands` and `Coordinator.external_commands`, and are dispatched by the coordinator after checking co\n\n===== pyproject.toml =====\n[build-system]\nrequires = [\"hatchling==1.29.0\"]\nbuild-backend = \"hatchling.build\"\n\n[project]\nname = \"py-agent\"\nversion = \"0.1.0\"\ndescription = \"Plugin-driven coding agent with a persistent local IPython workspace\"\nrequires-python = \">=3.12,\u003c3.15\"\ndependencies = [\"ipython==9.10.0\", \"prompt-toolkit==3.0.52\", \"litelm[anthropic]==0.5.2\", \"httpx==0.28.1\", \"pluggy==1.6.0\"]\n\n[project.optional-dependencies]\njupyter = [\"ipykernel>=6.29,\u003c8\", \"jupyter-client>=8,\u003c9\"]\n\n[project.scripts]\npy = \"py_agent.cli:main\"\n\n[project.entry-points.\"ipy_agent.plugins\"]\nisolated-executor = \"py_agent.isolated_executor:plugin\"\n\n[dependency-groups]\ndev = [\n    \"mypy\",\n    \"pytest==8.4.2\",\n    \"pytest-asyncio==1.2.0\",\n    \"ruff\",\n]\n\n[tool.uv]\n# Read-only mounts cannot protect dependency files through writable hardlink aliases.\nlink-mode = \"copy\"\n\n[tool.pytest.ini_options]\nasyncio_mode = \"auto\"\ntestpaths = [\"tests\"]\nmarkers = [\"live: explicitly authorized paid provider calls\"]\n\n\n[tool.mypy]\npython_version = \"3.12\"\nfiles = [\"src\"]\nstrict = false\nstrict_bytes = false\nlocal_partial_types = false\nextra_che
