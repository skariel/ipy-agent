name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --no-sync pytest -q -m 'not live'
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync mypy --config-file mypy-strict.toml
  jupyter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.13
      - run: uv sync --locked --extra jupyter --python 3.13
      - run: uv run --no-sync pytest -q -m 'not live'
      - run: uv run --no-sync mypy
