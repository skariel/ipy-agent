name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path transition/Cargo.toml --check
      - run: cargo build --locked --manifest-path transition/Cargo.toml
      - working-directory: transition
        run: env -u PY_CACHE_APPEND_ONLY PY_HARNESS_BIN="$PWD/target/debug/py" cargo test --locked -- --test-threads=2
