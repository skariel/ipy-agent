[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "py-agent"
version = "0.1.0"
description = "Persistent sandboxed IPython agent with agent-owned memory"
requires-python = ">=3.12,<3.15"
dependencies = ["ipython==9.10.0", "prompt-toolkit==3.0.52", "litelm[anthropic]==0.5.2", "httpx==0.28.1"]

[project.scripts]
py = "py_agent.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]

[tool.uv]
# Read-only mounts cannot protect dependency files through writable hardlink aliases.
link-mode = "copy"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["sandbox: requires functioning Linux srt isolation", "live: explicitly authorized paid provider calls"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/README.md", "/PLAN.md", "/IPYTHON_AGENT_PLAN.md", "/pyproject.toml", "/uv.lock"]

[tool.hatch.build.targets.wheel]
packages = ["src/py_agent"]
