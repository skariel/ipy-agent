[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "py-agent"
version = "0.1.0"
description = "Plugin-driven coding agent with a persistent local IPython workspace"
requires-python = ">=3.12,<3.15"
dependencies = [
    "ipython==9.10.0",
    "prompt-toolkit==3.0.52",
    "litelm[anthropic]==0.5.2",
    "httpx==0.28.1",
    "pluggy==1.6.0",
    "pillow>=11,<13",
]

[project.optional-dependencies]
jupyter = ["ipykernel>=6.29,<8", "jupyter-client>=8,<9"]

[project.scripts]
py = "py_agent.cli:main"

[project.entry-points."ipy_agent.plugins"]
isolated-executor = "py_agent.isolated_executor:plugin"

[dependency-groups]
dev = [
    "mypy",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "pytest-timeout>=2.4,<3",
    "ruff",
]

[tool.uv]
# Read-only mounts cannot protect dependency files through writable hardlink aliases.
link-mode = "copy"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
# Hard stops so a hung await can never wedge a run: faulthandler dumps stacks
# first, then pytest-timeout fails the test instead of blocking forever.
timeout = 60
timeout_method = "thread"
faulthandler_timeout = 50
markers = ["live: explicitly authorized paid provider calls"]


[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = false
strict_bytes = false
local_partial_types = false
extra_checks = false
warn_unreachable = false
warn_unused_configs = true
disallow_any_unimported = true
enable_error_code = []
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "import-untyped",
    "misc",
    "operator",
    "union-attr",
    "var-annotated",
]
show_error_code_links = true
show_error_context = true
pretty = true

[tool.ruff]
target-version = "py312"
line-length = 120
preview = true
extend-exclude = [".venv", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
# Mutually exclusive docstring styles and formatter-incompatible rules.
ignore = [
    "ANN",     # Mypy is the annotation authority.
    "missing-trailing-comma",  # Conflicts with the formatter.
    "missing-copyright-notice",  # The project has no mandated per-file copyright header.
    "D",       # Documentation policy is separate from static correctness.
    "DOC",     # Documentation policy is separate from static correctness.
    "raw-string-in-exception",   # Inline exception messages are clearer for this codebase.
    "f-string-in-exception",   # Dynamic exception messages are required for diagnostics.
    "single-line-implicit-string-concatenation",  # Conflicts with the formatter.
    "Q",       # The formatter owns quote style.
    "raise-vanilla-args",  # Local exception messages are intentionally specific.
    "unused-async",
    "suppressible-exception",
    "pytest-raises-ambiguous-pattern",
    "lambda-assignment",
    "multiple-with-statements",
    "ambiguous-unicode-character-string",
    "float-equality-comparison",
    "mutable-class-default",
    "assert-raises-exception",
]


[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG",     # Fixtures and protocol-shaped callbacks can be intentionally unused.
    "FBT",     # Tests may exercise positional boolean APIs.
    "import-private-name", # Tests intentionally inspect private implementation details.
    "magic-value-comparison", # Literal expected values improve test readability.
    "assert",    # Assertions are the test oracle.
    "private-member-access",  # White-box tests are intentional.
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = false
suppress-dummy-args = false
suppress-none-returning = false

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = []

[tool.ruff.lint.flake8-builtins]
strict-checking = true

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true
mark-parentheses = true
parametrize-names-type = "tuple"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["py_agent"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
preview = true
quote-style = "double"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/README.md", "/ARCHITECTURE_PLAN.md", "/ARCHITECTURE_STATUS.md", "/PLUGIN_API.md", "/pyproject.toml", "/uv.lock"]

[tool.hatch.build.targets.wheel]
packages = ["src/py_agent"]
