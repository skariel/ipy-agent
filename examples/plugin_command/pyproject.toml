[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "py-agent-example-command-context"
version = "0.1.0"
description = "External py-agent command and context-transform service example"
requires-python = ">=3.12"
dependencies = ["py-agent>=0.1.0,<0.2.0"]

[project.entry-points."ipy_agent.plugins"]
example-command-context = "example_command_context:plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/example_command_context"]
