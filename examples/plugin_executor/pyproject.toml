[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "py-agent-example-executor-wrapper"
version = "0.1.0"
description = "External py-agent executor wrapper contribution"
requires-python = ">=3.12"
dependencies = ["py-agent>=0.1.0,<0.2.0"]

[project.entry-points."ipy_agent.plugins"]
example-executor-wrapper = "example_executor_wrapper:plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/example_executor_wrapper"]
