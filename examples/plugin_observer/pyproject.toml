[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "py-agent-example-output-observer"
version = "0.1.0"
description = "External py-agent bounded output observer contribution"
requires-python = ">=3.12"
dependencies = ["py-agent>=0.1.0,<0.2.0"]

[project.entry-points."ipy_agent.plugins"]
example-output-observer = "example_output_observer:plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/example_output_observer"]
