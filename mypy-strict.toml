# Strict migration gate. Run: uv run mypy --config-file mypy-strict.toml
# Imported legacy modules are analyzed for types, but their errors belong to
# the full-repository migration, not this gate.
[tool.mypy]
python_version = "3.12"
strict = true
follow_imports = "silent"
files = [
    "src/py_agent/configuration.py",
    "src/py_agent/limits.py",
    "src/py_agent/collapse_control.py",
    "src/py_agent/context_export.py",
    "src/py_agent/terminal_markdown.py",
    "src/py_agent/retry_policy.py",
    "src/py_agent/async_commit.py",
    "src/py_agent/worker_protocol.py",
    "src/py_agent/coordinator_operation.py",
    "src/py_agent/coordinator_conversation.py",
    "src/py_agent/coordinator_direct.py",
    "src/py_agent/coordinator_frontend.py",
    "src/py_agent/coordinator_interfaces.py",
    "src/py_agent/coordinator_journal.py",
    "src/py_agent/coordinator_lifecycle.py",
    "src/py_agent/coordinator_model.py",
    "src/py_agent/coordinator_observations.py",
    "src/py_agent/coordinator_runner.py",
    "src/py_agent/coordinator_runtime.py",
    "src/py_agent/coordinator_support.py",
    "src/py_agent/journal_worker.py",
]
